services:
  tcp-client:
    build:
      context: ./tcp-client
    # Para xibir qual conexão está sendo feita no momento usar --verbose
    command: ["python", "tcp-client.py", "--host", "10.5.0.2", "--port", "8080", "--requests", "1000","--command", "SNMPWALK","--session", "--log", "performance.log", "--keep","1"]
    networks:
      aula-redes-snmp_my-network:
        ipv4_address: 10.5.0.3

networks:
  aula-redes-snmp_my-network:
    external: true
