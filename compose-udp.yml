services:
  udp-client:
    build:
      context: ./udp-client
    command: ["python", "udp-client.py", "--host", "10.5.0.4", "--port", "8081", "--requests", "1000", "--command", "SNMPGET 0"]
    networks:
      aula-redes-snmp_my-network:
        ipv4_address: 10.5.0.5
    tty: true

networks:
  aula-redes-snmp_my-network:
    external: true
